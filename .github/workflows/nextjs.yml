name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # Read the Pages URL without generating an incompatible CommonJS config.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # A domain change requires a fresh build: Next embeds paths in HTML/JS/CSS.
      - name: Resolve current public URL
        id: site
        run: node scripts/pages-config.mjs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.site.outputs.origin }}
          NEXT_PUBLIC_HOSTING: github-pages
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify exported routes and assets
        run: node scripts/check-pages.mjs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
